name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'Dockerfile'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t gwangtalpae-prod:latest .
          docker tag gwangtalpae-prod:latest ${{ steps.login-ecr.outputs.registry }}/gwangtalpae-prod:latest
          docker tag gwangtalpae-prod:latest ${{ steps.login-ecr.outputs.registry }}/gwangtalpae-prod:$(date +%Y%m%d-%H%M%S)

      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/gwangtalpae-prod:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/gwangtalpae-prod:$(date +%Y%m%d-%H%M%S)

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster gwangtalpae-prod-cluster \
            --service gwangtalpae-prod-service \
            --force-new-deployment \
            --region ap-northeast-2

      - name: Wait for deployment
        run: sleep 180

      - name: Check service status
        run: |
          aws ecs describe-services \
            --cluster gwangtalpae-prod-cluster \
            --services gwangtalpae-prod-service \
            --region ap-northeast-2 \
            --query 'services[0].[runningCount,desiredCount]' \
            --output text
